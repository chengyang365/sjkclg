    // Fetch API 真实后端联调器 (针对 Netlify 部署)
    // ==========================================
    
    // 🔴 步骤1: 请在这里填入您在 Google Apps Script 部署后得到的 Web App URL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbypof7i8UG4x4GxEaT5Mw5u_WPtvJHTT9FYnX0lGtgklahugJtfaRtPipKGc9jxrLrP/exec";

    // The server owns credential checks and must validate this short-lived token for
    // every write action. Never place an administrator PIN in this client.
    const getAdminToken = () => sessionStorage.getItem('sjkc_admin_token') || '';

    const apiRequest = async (action, data = {}) => {
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({ action, data, token: getAdminToken() })
        });
        const result = await response.json();
        if (result.status === 'success') return result.data;
        else throw new Error(result.message);
      } catch (error) {
        console.error("API Request Failed:", error);
        throw error;
      }
    };

    const server = {
      getInitialData: () => apiRequest('getInitialData', {}),
      authenticateAdmin: (pin) => apiRequest('authenticateAdmin', { pin }),
      saveApp: (data) => apiRequest('saveApp', data),
      deleteApp: (id) => apiRequest('deleteApp', { id }),
      recordClick: (id) => apiRequest('recordClick', { id }),
      updateAppOrders: (orders) => apiRequest('updateAppOrders', { orders }),
      saveSettings: (key, val) => apiRequest('saveSettings', { key, val }),
      getMpt4Teachers: (pageId, pageVersion) => apiRequest('getMpt4Teachers', { pageId, pageVersion }),
      submitMpt4Acknowledgement: (data) => apiRequest('submitMpt4Acknowledgement', data)

    const AnimatedNumber = ({ value }) => {
      const [displayValue, setDisplayValue] = useState(0);
      useEffect(() => {
        let start = 0; const duration = 1000; const increment = value / (duration / 16);
        const timer = setInterval(() => {
          start += increment;
          if (start >= value) { clearInterval(timer); setDisplayValue(value); } 
          else { setDisplayValue(Math.floor(start)); }
        }, 16);
        return () => clearInterval(timer);
      }, [value]);
      return <span>{displayValue.toLocaleString()}</span>;
    };

    const CustomIconSelect = ({ value, onChange, isDarkMode }) => {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);

      }, []);

    // 智能实时时钟钩子，时间中加入不换行空格（\u00A0）
    const useSmartClock = (lang) => {
      const [time, setTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      return useMemo(() => {
        const h = time.getHours();
        const m = time.getMinutes().toString().padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        const displayH = h % 12 || 12;
        const timeStr = `${displayH}:${m}\u00A0${ampm}`;

        const year = time.getFullYear();
        const month = time.getMonth() + 1;
        const date = time.getDate();
        const dayIdx = time.getDay();

        if (lang === 'zh') {
          const daysZh = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
          return `${year}年${month}月${date}日 ${daysZh[dayIdx]} ${timeStr}`;
        } else {
          const daysMs = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];

          return `${daysMs[dayIdx]}, ${date} ${monthsMs[month - 1]} ${year} ${timeStr}`;
        }
      }, [time, lang]);

    const MPT4Acknowledgement = ({ pageId, isDarkMode, lang }) => {
      const isZh = lang === 'zh';
      const [teachers, setTeachers] = useState([]);
      const [teachersLoading, setTeachersLoading] = useState(true);
      const [submittedCount, setSubmittedCount] = useState(0);
      const [totalCount, setTotalCount] = useState(0);
      const [teacherId, setTeacherId] = useState('');
      const [checked, setChecked] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [savedAt, setSavedAt] = useState('');
      const [error, setError] = useState('');
      const card = isDarkMode ? 'bg-slate-800/70 border-slate-700' : 'bg-white border-slate-200 shadow-sm';
      const applyTeacherStatus = result => {
        // Allow the current name-only API response to keep the form usable until GAS is redeployed.
        const status = Array.isArray(result)
          ? { teachers: result, submittedCount: 0, totalCount: result.length }
          : (result || {});
        setTeachers(Array.isArray(status.teachers) ? status.teachers : []);
        setSubmittedCount(Number(status.submittedCount) || 0);
        setTotalCount(Number(status.totalCount) || 0);
      };
      useEffect(() => {
        let active = true;
        server.getMpt4Teachers(pageId, 'v1')
          .then(result => { if (active) applyTeacherStatus(result); })
          .catch(() => { if (active) setError(isZh ? '无法读取 Users 教师名单，请检查网络后重试。' : 'Tidak dapat memuatkan senarai guru daripada Users. Sila semak Internet dan cuba lagi.'); })
          .finally(() => { if (active) setTeachersLoading(false); });
        return () => { active = false; };
      }, []);
      const copy = isZh ? {
        title: '教师阅读确认', prompt: '请确认您已阅读并了解本页面内容。', select: '请选择您的姓名',
        confirm: '我已阅读并了解本页面内容', submit: '提交阅读确认', saving: '提交中…',
        success: '确认已记录', time: '记录时间', required: '请选择姓名并勾选确认后再提交。',
        submitted: '已提交', alreadySubmitted: '此页面的阅读确认已提交，无需重复提交。', countLabel: '本页已提交', countSuffix: '位老师',
        failure: '提交失败。请检查网络连接后重试；您的选择仍会保留。',
        noTeachers: 'Users 表中没有可用的教师姓名。',
        note: '请以本人名义提交。系统记录教师姓名、页面版本和提交时间。'
      } : {
        title: 'Pengesahan Bacaan Guru', prompt: 'Sila sahkan bahawa anda telah membaca dan memahami kandungan halaman ini.',
        select: 'Pilih nama anda', confirm: 'Saya telah membaca dan memahami kandungan halaman ini',
        submit: 'Hantar Pengesahan', saving: 'Menghantar…', success: 'Pengesahan direkodkan', time: 'Masa rekod',
        required: 'Sila pilih nama dan tandakan pengesahan sebelum menghantar.',
        submitted: 'Telah dihantar', alreadySubmitted: 'Pengesahan untuk halaman ini telah dihantar. Tidak perlu hantar sekali lagi.', countLabel: 'Telah dihantar', countSuffix: 'orang guru',
        failure: 'Penghantaran gagal. Semak sambungan Internet dan cuba lagi; pilihan anda dikekalkan.',
        noTeachers: 'Tiada nama guru yang boleh dipilih dalam helaian Users.',
        note: 'Sila hantar atas nama sendiri. Nama guru, versi halaman dan masa penghantaran akan direkodkan.'
      };

        event.preventDefault();
        setError('');
        if (!teacherId || !checked) { setError(copy.required); return; }
        setSubmitting(true);
        try {
          const result = await server.submitMpt4Acknowledgement({ pageId, pageVersion: 'v1', teacherId: Number(teacherId), language: lang });
          setSavedAt(result.confirmedAt || new Date().toISOString());

          setTotalCount(Number(result.totalCount) || totalCount);
        } catch (e) {
          if (e.message === 'ALREADY_SUBMITTED') {
            setError(copy.alreadySubmitted);
            try {
              const latest = await server.getMpt4Teachers(pageId, 'v1');
              applyTeacherStatus(latest);
            } catch (_) {}
          } else setError(copy.failure);
        } finally {
          setSubmitting(false);
        }
      };
      return <section className="pt-12" aria-labelledby={`${pageId}-ack-title`}>
        <div className={`rounded-3xl border p-5 sm:p-7 ${card}`}>

            {!teachersLoading && teachers.length === 0 && !error && <p role="status" className="text-sm font-semibold opacity-70">{copy.noTeachers}</p>}
            <label className="flex items-start gap-3 p-4 rounded-xl border border-blue-200 dark:border-blue-900 bg-blue-50 dark:bg-blue-950/30 cursor-pointer"><input type="checkbox" checked={checked} onChange={e => { setChecked(e.target.checked); setSavedAt(''); }} className="mt-1 w-5 h-5 accent-blue-600 shrink-0"/><span className="text-sm font-bold leading-6">{copy.confirm}</span></label>
            {error && <p role="alert" className="text-sm font-bold text-rose-600 dark:text-rose-300">{error}</p>}
            {savedAt && <p role="status" className="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-emerald-800 dark:text-emerald-200 text-sm font-bold"><i className="ph-bold ph-check-circle mr-2"></i>{copy.success} · {copy.time}: {new Date(savedAt).toLocaleString(isZh ? 'zh-CN' : 'ms-MY', { timeZone: 'Asia/Kuala_Lumpur' })}</p>}

          </form>
        </div>
      </section>;

    const useModalKeyboard = (isOpen, onClose) => {
      useEffect(() => {
        if (!isOpen) return;
        const previousFocus = document.activeElement;
        const timer = setTimeout(() => {
          const dialog = document.querySelector('[role="dialog"]');
          dialog?.querySelector('input, button, select, textarea, [tabindex]:not([tabindex="-1"])')?.focus();
        }, 0);
        const handleKeyDown = (event) => {
          if (event.key === 'Escape') { event.preventDefault(); onClose(); return; }
          if (event.key !== 'Tab') return;
          const dialog = document.querySelector('[role="dialog"]');
          const focusable = [...(dialog?.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])') || [])];
          if (!focusable.length) return;
          const first = focusable[0], last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => { clearTimeout(timer); document.removeEventListener('keydown', handleKeyDown); previousFocus?.focus?.(); };
      }, [isOpen]);
    };

    function App() {
      const [isAdmin, setIsAdmin] = useState(() => {
        try { return !!getAdminToken() && Number(sessionStorage.getItem('sjkc_admin_expires_at')) > Date.now(); } catch { return false; }
      });

      const [clickCount, setClickCount] = useState(0);
      const clickTimeoutRef = useRef(null);
      const [showPinModal, setShowPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);
      const [isAuthenticating, setIsAuthenticating] = useState(false);

      const endAdminSession = () => {
        sessionStorage.removeItem('sjkc_admin_token');
        sessionStorage.removeItem('sjkc_admin_expires_at');
        setIsAdmin(false);
      };

      useEffect(() => {
        if (!isAdmin) return;
        const expiresAt = Number(sessionStorage.getItem('sjkc_admin_expires_at'));
        const timer = setTimeout(endAdminSession, Math.max(0, expiresAt - Date.now()));
        return () => clearTimeout(timer);
      }, [isAdmin]);

      const handleLogoClick = () => {
        if (isAdmin) { endAdminSession(); return; }
        setClickCount(prev => prev + 1);
        if (clickTimeoutRef.current) clearTimeout(clickTimeoutRef.current);
        clickTimeoutRef.current = setTimeout(() => setClickCount(0), 1000);
      };

      useEffect(() => { if (clickCount >= 5) { setShowPinModal(true); setClickCount(0); } }, [clickCount]);

      const handlePinSubmit = async (e) => {
        e.preventDefault();
        setIsAuthenticating(true);
        try {
          const session = await server.authenticateAdmin(pinInput);
          if (!session?.token || !session?.expiresAt) throw new Error('Invalid session response');
          sessionStorage.setItem('sjkc_admin_token', session.token);
          sessionStorage.setItem('sjkc_admin_expires_at', String(new Date(session.expiresAt).getTime()));
          setIsAdmin(true); setShowPinModal(false); setPinInput(''); setPinError(false); vibrate(50);
        } catch (error) {
          setPinError(true); setPinInput(''); vibrate([30,50,30]);
        } finally { setIsAuthenticating(false); }
      };

      const [apps, setApps] = useState([]);
      const [announcement, setAnnouncement] = useState({ active: false, zh: '', ms: '' });
      const [schoolEvent, setSchoolEvent] = useState({ active: false, zh: '', ms: '', date: '' });
      const [loading, setLoading] = useState(true);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncError, setSyncError] = useState('');
      const [lastSyncedAt, setLastSyncedAt] = useState(() => localStorage.getItem('sjkc_last_synced_at') || '');
      const [refreshNonce, setRefreshNonce] = useState(0);
      const [appUpdateStatus, setAppUpdateStatus] = useState(navigator.onLine ? 'checking' : 'offline');
      const [appUpdateCheckedAt, setAppUpdateCheckedAt] = useState('');
      const updateRegistrationRef = useRef(null);
      const reloadAfterUpdateRef = useRef(false);
      
      const [lang, setLang] = useState(() => {
        try { return localStorage.getItem('sjkc_language') || 'zh'; } catch { return 'zh'; }

      const [isDarkMode, setIsDarkMode] = useState(() => {
        try { return localStorage.getItem('sjkc_dark_mode') === 'true'; } catch { return false; }
      });
      const [activePage, setActivePage] = useState('home');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeTab, setActiveTab] = useState('all');
      
      const currentDateTimeStr = useSmartClock(lang);

      const [viewMode, setViewMode] = useState(() => {
        try { return localStorage.getItem('sjkc_view_mode') || 'grid'; } catch { return 'grid'; }
      });
      useEffect(() => { localStorage.setItem('sjkc_view_mode', viewMode); }, [viewMode]);

      const [isOffline, setIsOffline] = useState(!navigator.onLine);
      useEffect(() => {
        const handleOnline = () => { setIsOffline(false); checkForAppUpdate(); };
        const handleOffline = () => { setIsOffline(true); setAppUpdateStatus('offline'); };
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); };
      }, []);

      const [recentIds, setRecentIds] = useState(() => {
        try { return JSON.parse(localStorage.getItem('sjkc_recent_apps') || '[]'); } catch { return []; }
      });

      const [toast, setToast] = useState({ visible: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => {
        vibrate(type === 'error' ? [30, 50, 30] : 30);
        setToast({ visible: true, message, type });
        setTimeout(() => setToast(t => ({ ...t, visible: false })), 3000);
      };

      const [showInstallPrompt, setShowInstallPrompt] = useState(false);
      const [isIOS, setIsIOS] = useState(false);
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const [pinnedIds, setPinnedIds] = useState(() => {
        try { const saved = localStorage.getItem('sjkc_superapp_pinned'); return saved ? JSON.parse(saved) : []; } catch { return []; }
      });
      useEffect(() => { localStorage.setItem('sjkc_superapp_pinned', JSON.stringify(pinnedIds)); }, [pinnedIds]);

      const [isAppModalOpen, setIsAppModalOpen] = useState(false);
      const [isAnnModalOpen, setIsAnnModalOpen] = useState(false);
      const [isEventModalOpen, setIsEventModalOpen] = useState(false);
      const [isDataModalOpen, setIsDataModalOpen] = useState(false); 
      const [qrApp, setQrApp] = useState(null);
      
      const [isFabOpen, setIsFabOpen] = useState(false);
      
      const [editingApp, setEditingApp] = useState(null);
      const [formData, setFormData] = useState({ url: '', icon: 'Settings', category: 'admin', zhTitle: '', zhDesc: '', msTitle: '', msDesc: '' });
      const [isCustomIcon, setIsCustomIcon] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const [shortcutKey, setShortcutKey] = useState('⌘K');
      useEffect(() => {
        if (navigator.userAgent.indexOf('Win') !== -1 || navigator.userAgent.indexOf('Linux') !== -1) {
          setShortcutKey('Ctrl+K');
        } else {
          setShortcutKey('⌘K');
        }
      }, []);

      const currentT = t[lang];
      const appVersionLabel = !navigator.onLine || appUpdateStatus === 'offline' ? currentT.appVersionOffline
        : appUpdateStatus === 'available' ? currentT.appVersionAvailable
        : appUpdateStatus === 'checking' ? currentT.appVersionChecking
        : appUpdateStatus === 'error' ? currentT.appVersionError
        : currentT.appVersionCurrent;

      useEffect(() => {
        document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'ms';
        localStorage.setItem('sjkc_language', lang);
      }, [lang]);

      const searchInputRef = useRef(null);
      const [isSearchFocused, setIsSearchFocused] = useState(false);
      const [kbIndex, setKbIndex] = useState(-1);

      const filteredApps = useMemo(() => {
        const s = searchQuery.toLowerCase();
        if (!s) return apps;
        return apps.filter(app => app.zhTitle?.toLowerCase().includes(s) || app.msTitle?.toLowerCase().includes(s) || app.zhDesc?.toLowerCase().includes(s) || app.msDesc?.toLowerCase().includes(s));
      }, [apps, searchQuery]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchInputRef.current?.focus(); return; }
          
          if (isSearchFocused && searchQuery) {
            if (e.key === 'ArrowDown') {
              e.preventDefault();
              setKbIndex(prev => Math.min(prev + 1, filteredApps.length - 1));
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              setKbIndex(prev => Math.max(prev - 1, 0));
            } else if (e.key === 'Enter') {
              e.preventDefault();
              if (kbIndex >= 0 && filteredApps[kbIndex]) {
                const targetApp = filteredApps[kbIndex];
                handleAppClick(null, targetApp);
                window.open(targetApp.url, '_blank');
              }
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isSearchFocused, searchQuery, filteredApps, kbIndex]);

      useEffect(() => { setKbIndex(searchQuery ? 0 : -1); }, [searchQuery]);

      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('sjkc_dark_mode', String(isDarkMode));
      }, [isDarkMode]);

      useEffect(() => {
        const cachedData = localStorage.getItem('sjkc_staff_cache');
        if (cachedData) {
          try {
            const parsed = JSON.parse(cachedData);
            setApps(parsed.apps || []);
            if (parsed.settings) {
              if (parsed.settings.announcement) setAnnouncement(parsed.settings.announcement);
              if (parsed.settings.event) setSchoolEvent(parsed.settings.event);
            }
            setLoading(false); setIsSyncing(true); 
          } catch(e) {}
        }

        if (!isOffline) {
          setIsSyncing(true);
          setSyncError('');
          server.getInitialData().then(res => {
            let loadedApps = res.apps || [];
            loadedApps.sort((a, b) => (a.order || 0) - (b.order || 0));
            loadedApps = loadedApps.map(a => ({
              ...a, zh: { title: a.zhTitle, desc: a.zhDesc }, ms: { title: a.msTitle, desc: a.msDesc }, clicks: parseInt(a.clicks) || 0
            }));
            setApps(loadedApps);
            if (res.settings) {
              if (res.settings.announcement) setAnnouncement(res.settings.announcement);
              if (res.settings.event) setSchoolEvent(res.settings.event);
            }
            setLoading(false); setIsSyncing(false);
            localStorage.setItem('sjkc_staff_cache', JSON.stringify({ apps: loadedApps, settings: res.settings }));
            const syncedAt = new Date().toISOString();
            setLastSyncedAt(syncedAt);
            localStorage.setItem('sjkc_last_synced_at', syncedAt);
          }).catch(err => {
            console.error("无法连接到云端数据库:", err);
            setLoading(false); setIsSyncing(false);
            setSyncError(lang === 'zh' ? '无法连接云端，正在显示上次保存的内容。' : 'Unable to reach the cloud. Showing your last saved content.');
          });
        }

        const isIosDevice = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
        if (isIosDevice && !window.navigator.standalone && !localStorage.getItem('sjkc_pwa_ios')) {
          setIsIOS(true); setShowInstallPrompt(true);
        }
        const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); setShowInstallPrompt(true); };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, [isOffline, refreshNonce]);

      const checkForAppUpdate = async () => {
        if (!navigator.onLine) { setAppUpdateStatus('offline'); return; }
        if (!('serviceWorker' in navigator)) { setAppUpdateStatus('error'); return; }
        setAppUpdateStatus('checking');
        try {
          let registration = updateRegistrationRef.current || await navigator.serviceWorker.getRegistration();
          if (!registration) registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
          updateRegistrationRef.current = registration;
          if (registration.waiting) {
            reloadAfterUpdateRef.current = true;
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            return;
          }
          await registration.update();
          if (registration.waiting) {
            reloadAfterUpdateRef.current = true;
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            return;
          }
          setAppUpdateCheckedAt(new Date().toISOString());
          setAppUpdateStatus('current');
          setRefreshNonce(value => value + 1);
        } catch (error) {
          console.warn('App update check failed:', error);
          setAppUpdateStatus('error');
        }
      };

      useEffect(() => {
        if (!('serviceWorker' in navigator)) { setAppUpdateStatus('error'); return; }
        let active = true;
        const onControllerChange = () => {
          if (reloadAfterUpdateRef.current) window.location.reload();
        };
        navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(registration => {
          if (!active) return;
          updateRegistrationRef.current = registration;
          const inspectWorker = () => {
            if (registration.waiting && navigator.serviceWorker.controller) setAppUpdateStatus('available');
          };
          registration.addEventListener('updatefound', () => {
            const installing = registration.installing;
            installing?.addEventListener('statechange', inspectWorker);
          });
          inspectWorker();
          if (navigator.onLine) registration.update().then(() => {
            inspectWorker();
            if (!registration.waiting && active) {
              setAppUpdateCheckedAt(new Date().toISOString());
              setAppUpdateStatus('current');
            }
          }).catch(() => { if (active) setAppUpdateStatus('error'); });
          else setAppUpdateStatus('offline');
        }).catch(error => {
          console.warn('Service worker registration failed:', error);
          if (active) setAppUpdateStatus('error');
        });
        return () => { active = false; navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange); };
      }, []);

      const handleInstallClick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') setShowInstallPrompt(false);
          setDeferredPrompt(null);
        } else if (isIOS) {
          setShowInstallPrompt(false);
          localStorage.setItem('sjkc_superapp_ios_prompted', 'true');
        }
      };

      const handleDismissPrompt = () => {
        setShowInstallPrompt(false);
        if (isIOS) localStorage.setItem('sjkc_superapp_ios_prompted', 'true');
      };

      const togglePin = (e, appId) => {
        e.preventDefault(); e.stopPropagation(); vibrate(20);
        const isPinned = pinnedIds.includes(appId);
        setPinnedIds(prev => isPinned ? prev.filter(id => id !== appId) : [...prev, appId]);
        showToast(isPinned ? currentT.toastUnpinned : currentT.toastPinned, 'info');
      };

      const handleAppClick = (e, app) => {
        setRecentIds(prev => {
          const newRecent = [app.id, ...prev.filter(id => id !== app.id)].slice(0, 4);
          localStorage.setItem('sjkc_recent_apps', JSON.stringify(newRecent));
          return newRecent;
        });

        if (!isOffline) {
          setApps(apps.map(a => a.id === app.id ? { ...a, clicks: a.clicks + 1 } : a));
          server.recordClick(app.id);
        }
      };

      // 🔥 新增：底层兼容的复制链接函数
      const handleCopyUrl = (url) => {
        vibrate(20);
        try {
          const textArea = document.createElement("textarea");
          textArea.value = url;
          // 防止手机屏幕滚动
          textArea.style.top = "0";
          textArea.style.left = "0";
          textArea.style.position = "fixed";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(textArea);
          if (successful) {
             showToast(currentT.copied, 'success');
          } else {
             showToast(currentT.copyFailed, 'error');
          }
        } catch (err) {
          showToast(currentT.copyFailed, 'error');
        }
      };

      const ConfirmModal = ({ isOpen, onClose, onConfirm, title, desc }) => {
        if (!isOpen) return null;
        return (
          <div role="dialog" aria-modal="true" aria-label={title} className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md animate-in fade-in duration-200" onClick={onClose}>
            <div className={`rounded-[2.5rem] shadow-2xl w-full max-w-sm p-8 flex flex-col items-center animate-in zoom-in-95 duration-300 ${isDarkMode ? 'bg-slate-800 border border-slate-700' : 'bg-white border border-slate-100'}`} onClick={e=>e.stopPropagation()}>
              <div className="w-16 h-16 rounded-[1.5rem] bg-rose-500/10 text-rose-500 flex items-center justify-center mb-6 shadow-inner"><i className="ph-fill ph-trash text-3xl"></i></div>
              <h3 className={`text-[1.35rem] font-extrabold tracking-tight mb-2 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>{title}</h3>
              <p className={`text-[0.875rem] font-medium text-center mb-8 leading-relaxed opacity-80 ${isDarkMode ? 'text-slate-300' : 'text-slate-500'}`}>{desc}</p>
              <div className="flex gap-3 w-full">
                <button onClick={onClose} className={`flex-1 py-3.5 font-bold rounded-[1rem] transition-colors ${isDarkMode ? 'bg-slate-700 hover:bg-slate-600 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>{currentT.cancel}</button>
                <button onClick={() => { vibrate(40); onConfirm(); }} className="flex-1 py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-[1rem] shadow-lg shadow-rose-500/30 active:scale-95 transition-all">确认删除</button>
              </div>
            </div>
          </div>
        );
      };
      
      const [appToDelete, setAppToDelete] = useState(null);
      const isAnyModalOpen = showPinModal || isAppModalOpen || isAnnModalOpen || isEventModalOpen || isDataModalOpen || !!qrApp || !!appToDelete;
      useModalKeyboard(isAnyModalOpen, () => {
        if (showPinModal) setShowPinModal(false);
        else if (appToDelete) setAppToDelete(null);
        else if (qrApp) setQrApp(null);
        else if (isAppModalOpen) setIsAppModalOpen(false);
        else if (isAnnModalOpen) setIsAnnModalOpen(false);
        else if (isEventModalOpen) setIsEventModalOpen(false);
        else if (isDataModalOpen) setIsDataModalOpen(false);
      });
      const handleDeleteConfirm = async () => {
        if (appToDelete) {
          setApps(apps.filter(a => a.id !== appToDelete));
          setPinnedIds(prev => prev.filter(pId => pId !== appToDelete));
          if(!isOffline) server.deleteApp(appToDelete);
          showToast(currentT.toastDeleted, 'error');
          setAppToDelete(null);
        }
      };

      const [draggedApp, setDraggedApp] = useState(null);
      const handleDragStart = (e, app) => {
        if (!isAdmin) return; vibrate(20);
        setDraggedApp(app); e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => { e.target.style.opacity = '0.5'; e.target.style.transform = 'scale(0.95)'; }, 0);
      };
      const handleDragEnd = (e) => { 
        e.target.style.opacity = '1'; e.target.style.transform = 'scale(1)'; setDraggedApp(null); 
      };
      const handleDrop = async (e, targetApp) => {
        e.preventDefault();
        if (!isAdmin || !draggedApp || draggedApp.id === targetApp.id || draggedApp.category !== targetApp.category) return;
        vibrate(30);
        const categoryApps = apps.filter(a => a.category === targetApp.category);
        const draggedIdx = categoryApps.findIndex(a => a.id === draggedApp.id);
        const targetIdx = categoryApps.findIndex(a => a.id === targetApp.id);
        const newCategoryApps = [...categoryApps];
        newCategoryApps.splice(draggedIdx, 1);
        newCategoryApps.splice(targetIdx, 0, draggedApp);
        const newApps = apps.map(a => {
           if(a.category !== targetApp.category) return a;
           const newOrderIndex = newCategoryApps.findIndex(na => na.id === a.id);
           return { ...a, order: newOrderIndex };
        }).sort((a, b) => a.order - b.order);
        
        setApps(newApps);
        if(!isOffline) {
          const orders = newCategoryApps.map((a, idx) => ({ id: a.id, order: idx }));
          server.updateAppOrders(orders);
        }
      };

      const handleSaveApp = async (e) => {
        e.preventDefault(); setIsSaving(true);
        const newId = editingApp ? editingApp.id : Date.now().toString();
        const appData = { ...formData, id: newId, order: editingApp ? editingApp.order : apps.filter(a => a.category === formData.category).length, clicks: editingApp ? editingApp.clicks : 0, createdAt: editingApp ? editingApp.createdAt : Date.now() };
        const frontendApp = { ...appData, zh: { title: appData.zhTitle, desc: appData.zhDesc }, ms: { title: appData.msTitle, desc: appData.msDesc } };
        try {
          if(!isOffline) await server.saveApp(appData);
          const nextApps = editingApp ? apps.map(a => a.id === newId ? frontendApp : a) : [...apps, frontendApp];
          setApps(nextApps);
          localStorage.setItem('sjkc_staff_cache', JSON.stringify({ apps: nextApps, settings: { announcement, event: schoolEvent } }));
          setIsAppModalOpen(false); setIsFabOpen(false);
          showToast(currentT.toastSaved, 'success');
        } catch (error) {
          console.error('Unable to save app:', error);
          showToast(lang === 'zh' ? '保存失败，请检查网络后重试。' : 'Save failed. Check your connection and try again.', 'error');
        } finally { setIsSaving(false); }
      };

      const handleSaveSetting = async (e, type, data, setModal) => {
        e.preventDefault(); setIsSaving(true);
        try {
          if(!isOffline) await server.saveSettings(type, data);
          localStorage.setItem('sjkc_staff_cache', JSON.stringify({ apps, settings: { announcement, event: schoolEvent } }));
          setModal(false); setIsFabOpen(false); showToast(currentT.toastSaved, 'success');
        } catch (error) {
          console.error('Unable to save setting:', error);
          showToast(lang === 'zh' ? '保存失败，请检查网络后重试。' : 'Save failed. Check your connection and try again.', 'error');
        } finally { setIsSaving(false); }
      };

      const handleExportCSV = () => {
        vibrate(20);
        const headers = ['ID', 'Category', 'Chinese Title', 'Malay Title', 'Total Clicks'];
        const csvContent = [headers.join(','), ...apps.map(a => `${a.id},${a.category},"${a.zh?.title || ''}","${a.ms?.title || ''}",${a.clicks || 0}`)].join('\n');
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.setAttribute("href", URL.createObjectURL(blob));
        link.setAttribute("download", `Ladang_Grisek_Analytics_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const groupedApps = useMemo(() => {
        return { 
          pinned: filteredApps.filter(a => pinnedIds.includes(a.id)),
          admin: filteredApps.filter(a => a.category === 'admin'),

          hem: filteredApps.filter(a => a.category === 'hem'), 
          koko: filteredApps.filter(a => a.category === 'koko'), 
          other: filteredApps.filter(a => a.category === 'other') 
        };

      const recentAppsList = useMemo(() => {

        const diff = new Date(schoolEvent.date).setHours(0,0,0,0) - new Date().setHours(0,0,0,0);
        const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
        if (days > 0) return { num: days, text: currentT.daysLeft, color: 'text-blue-500 dark:text-blue-400' };
        if (days === 0) return { num: '', text: currentT.todayIs, color: 'text-rose-500 dark:text-rose-400' };
        return { num: '', text: currentT.passed, color: 'text-slate-500' };
      }, [schoolEvent, currentT]);

        const sortedApps = [...apps].sort((a, b) => (b.clicks || 0) - (a.clicks || 0)).slice(0, 5);
        const maxClicks = sortedApps.length > 0 ? sortedApps[0].clicks : 1; 
        const catMap = { 'admin':0, 'kurikulum':0, 'hem':0, 'koko':0, 'other':0 };
        apps.forEach(a => { if(catMap[a.category] !== undefined) catMap[a.category] += (a.clicks || 0); });
        return { totalApps, totalVisits, topApps: sortedApps, maxClicks, catMap };
      }, [apps]);

      const ambientClasses = getAmbientClasses(isDarkMode);
      const compactAppUpdateControl = (
        <div className="fixed bottom-3 left-3 z-[90] pointer-events-none">
          <div className={`pointer-events-auto max-w-[calc(100vw-1.5rem)] flex items-center gap-2 px-3 py-2 rounded-2xl shadow-lg border backdrop-blur-xl ${isDarkMode ? 'bg-slate-900/95 border-slate-700 text-slate-300' : 'bg-white/95 border-slate-200 text-slate-600'}`}>
            <span className={`w-2 h-2 rounded-full shrink-0 ${appUpdateStatus === 'current' && navigator.onLine ? 'bg-emerald-500' : appUpdateStatus === 'available' ? 'bg-blue-500' : 'bg-amber-500'}`}></span>
            <span className="text-[0.65rem] font-semibold truncate max-w-[58vw]" aria-live="polite">{appVersionLabel}</span>
            <button type="button" onClick={checkForAppUpdate} disabled={appUpdateStatus === 'checking'} aria-label={currentT.appUpdateAria} className="min-w-10 min-h-10 rounded-xl flex items-center justify-center text-blue-600 dark:text-blue-300 disabled:opacity-60">
              <i className={`ph-bold text-lg ${appUpdateStatus === 'checking' ? 'ph-spinner-gap animate-spin' : appUpdateStatus === 'available' ? 'ph-download-simple' : 'ph-arrows-clockwise'}`}></i>
            </button>
          </div>
        </div>
      );

      const renderAppCard = (app, index, isPinnedSection = false, isSearchList = false) => {
        const isPinned = pinnedIds.includes(app.id);
        const showNewBadge = (Date.now() - app.createdAt) < (7 * 24 * 60 * 60 * 1000);
        const isList = viewMode === 'list' || isSearchList;
        const isKeyboardFocused = isSearchList && index === kbIndex;

        const handleMouseMove = (e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          e.currentTarget.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
          e.currentTarget.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);

          <div

            draggable={isAdmin && !isPinnedSection && activeTab === 'all' && !isSearchList} 
            onDragStart={(e) => (!isPinnedSection && activeTab === 'all' && !isSearchList) && handleDragStart(e, app)}
            onDragEnd={(!isPinnedSection && activeTab === 'all' && !isSearchList) ? handleDragEnd : undefined}
            onDragOver={(e) => { e.preventDefault(); }}

                <a href="https://t.me/joinchat/AAAAAFO_CLf9jCQbFIq_Lg" target="_blank" rel="noreferrer" className={`flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm transition-all active:scale-95 ${isDarkMode ? 'bg-cyan-900/30 text-cyan-400 hover:bg-cyan-900/50 border border-cyan-800/30' : 'bg-cyan-50 text-cyan-600 hover:bg-cyan-100 border border-cyan-100'}`}>

                <div className={`w-20 h-20 rounded-[1.5rem] flex items-center justify-center mb-5 shadow-sm border ${isDarkMode ? 'bg-slate-900 border-slate-700 text-blue-400' : 'bg-gradient-to-br from-white to-blue-50 border-blue-100 text-blue-600'}`}>
                  {renderIcon(qrApp.icon, true)}

                <h2 className="text-xl font-extrabold tracking-tight text-center mb-2 leading-tight px-4">{qrApp.zh?.title || currentT.qrTitle}</h2>

                    <i className="ph-bold ph-link text-lg shrink-0"></i>
                    <span className="truncate">{qrApp.url.replace(/^https?:\/\//,'')}</span>

                  <button onClick={() => handleCopyUrl(qrApp.url)} className={`shrink-0 p-2.5 rounded-xl transition-all active:scale-90 ${isDarkMode ? 'bg-slate-800 text-blue-400 hover:bg-slate-700 border border-slate-700' : 'bg-white text-blue-600 shadow-sm border border-slate-200 hover:bg-blue-50'}`} title="一键复制链接">

              <div className={`rounded-[2.5rem] shadow-2xl w-full max-w-4xl p-6 sm:p-8 relative animate-in zoom-in-95 duration-300 flex flex-col max-h-[90vh] ${isDarkMode ? 'bg-[#090E17] border border-slate-800' : 'bg-slate-50 border border-slate-200'}`}>
                <div className="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-6 sm:hidden shrink-0"></div>
                <div className="flex justify-between items-center mb-6 shrink-0">
                  <h2 className="text-xl sm:text-2xl font-extrabold tracking-tight flex items-center gap-2"><i className="ph-fill ph-chart-pie-slice text-purple-500 text-3xl"></i> Global Analytics</h2>
                  <div className="flex items-center gap-2">
                    <button onClick={handleExportCSV} className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-transform active:scale-95 ${isDarkMode ? 'bg-purple-900/50 text-purple-400 hover:bg-purple-800/80' : 'bg-purple-50 text-purple-600 hover:bg-purple-100'}`}><i className="ph-bold ph-download-simple"></i> <span className="hidden sm:inline">Export CSV</span></button>
                    <button onClick={() => setIsDataModalOpen(false)} className={`p-2 rounded-full ${isDarkMode ? 'bg-slate-800 hover:bg-slate-700' : 'bg-white hover:bg-slate-100 shadow-sm'}`}><i className="ph-bold ph-x text-lg"></i></button>
                  </div>
                </div>
                
                <div className="overflow-y-auto hide-scrollbar flex-1 pb-safe">
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-5 mb-5">
                    <div className={`col-span-2 md:col-span-2 p-6 sm:p-8 rounded-[2rem] border relative overflow-hidden ${isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-white border-slate-100 shadow-sm'}`}>
                      <div className="absolute -right-6 -bottom-6 w-32 h-32 bg-blue-500/20 blur-3xl rounded-full"></div>

                    <div className={`col-span-1 md:col-span-1 p-6 sm:p-8 rounded-[2rem] border flex flex-col justify-between ${isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-white border-slate-100 shadow-sm'}`}>

                    </div>
                    <div className={`col-span-1 md:col-span-1 p-6 sm:p-8 rounded-[2rem] border flex flex-col justify-between ${isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-white border-slate-100 shadow-sm'}`}>

                      <div><p className="text-[0.75rem] font-bold uppercase tracking-wider opacity-60 mb-1">Access</p><h3 className="text-xl mt-1 font-black tabular-nums">Staff Only</h3></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">

                      <h3 className="text-base font-extrabold tracking-tight mb-6 flex items-center gap-2"><i className="ph-fill ph-fire text-orange-500"></i> Top 5 Most Used</h3>
                      <div className="space-y-6">
                        {dashboardStats.topApps.map((app, idx) => (
                          <div key={app.id} className="relative">
                            <div className="flex justify-between text-sm font-bold mb-2.5"><span>{idx+1}. {app.zh?.title}</span><span className="opacity-60">{app.clicks}</span></div>
                            <div className={`w-full h-3 rounded-full overflow-hidden ${isDarkMode ? 'bg-slate-900' : 'bg-slate-100 shadow-inner'}`}>
                              <div className="h-full rounded-full bg-gradient-to-r from-blue-500 to-indigo-500 animate-grow" style={{'--target-width': `${(app.clicks / dashboardStats.maxClicks) * 100}%`}}></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className={`md:col-span-1 p-6 sm:p-8 rounded-[2rem] border ${isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-white border-slate-100 shadow-sm'}`}>
                      <h3 className="text-base font-extrabold tracking-tight mb-6 flex items-center gap-2"><i className="ph-fill ph-chart-donut text-purple-500"></i> Distribution</h3>
                      <div className="space-y-4">
                        {Object.entries(dashboardStats.catMap).sort((a,b)=>b[1]-a[1]).map(([cat, clicks]) => {
                          const pct = dashboardStats.totalVisits > 0 ? Math.round((clicks / dashboardStats.totalVisits) * 100) : 0;
                          return (
                            <div key={cat} className={`flex items-center justify-between p-3.5 rounded-[1rem] border ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-slate-50 border-slate-100'}`}>
                              <span className="text-[0.75rem] font-bold opacity-80 uppercase tracking-wide">{currentT.tabs[cat]}</span>
                              <span className="font-black text-sm">{pct}%</span>

                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {isAppModalOpen && (
            <div role="dialog" aria-modal="true" aria-label={editingApp ? currentT.editApp : currentT.addApp} className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md bottom-sheet animate-in fade-in">
              <div className={`rounded-[2.5rem] shadow-2xl w-full max-w-2xl p-6 sm:p-8 relative animate-in zoom-in-95 sm:zoom-in-100 duration-300 flex flex-col ${isDarkMode ? 'bg-slate-800' : 'bg-white'}`}>

                        <label className="text-[0.7rem] font-bold opacity-60 uppercase tracking-wider ml-1">Category</label>

                          <option value="kurikulum">{currentT.categories.kurikulum}</option>
                          <option value="hem">{currentT.categories.hem}</option>
                          <option value="koko">{currentT.categories.koko}</option>
                          <option value="other">{currentT.categories.other}</option>
                        </select>
                      </div>
                      
                      <div className="space-y-2 z-50">
                        <div className="flex justify-between items-center ml-1">

                            {isCustomIcon ? '使用预设图标' : '自定义图片 / Emoji'}
                          </button>
                        </div>
                        {isCustomIcon ? (

                        ) : (
                          <CustomIconSelect value={iconMap[formData.icon] ? formData.icon : 'Settings'} onChange={(val) => setFormData({...formData, icon: val})} isDarkMode={isDarkMode} />
                        )}
                      </div>
                      
                      <div className="col-span-2 space-y-2">
                        <label className="text-[0.7rem] font-bold opacity-60 uppercase tracking-wider ml-1">App URL</label>
                        <input type="url" required value={formData.url} onChange={e => setFormData({...formData, url: e.target.value})} className={`w-full border rounded-2xl px-5 py-4 font-medium outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-slate-50 border-slate-200'}`} placeholder="https://" />
                      </div>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-5">

                        <textarea required value={formData.zhDesc} onChange={e => setFormData({...formData, zhDesc: e.target.value})} className={`w-full border rounded-[1rem] px-4 py-3 font-medium outline-none focus:ring-2 focus:ring-blue-500 resize-none ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`} placeholder="描述" rows={2}/>

                        <input required value={formData.msTitle} onChange={e => setFormData({...formData, msTitle: e.target.value})} className={`w-full border rounded-[1rem] px-4 py-3 font-bold outline-none focus:ring-2 focus:ring-indigo-500 ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`} placeholder="Tajuk" />
                        <textarea required value={formData.msDesc} onChange={e => setFormData({...formData, msDesc: e.target.value})} className={`w-full border rounded-[1rem] px-4 py-3 font-medium outline-none focus:ring-2 focus:ring-indigo-500 resize-none ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`} placeholder="Penerangan" rows={2}/>
                      </div>
                    </div>
                    <button type="submit" disabled={isSaving || isOffline} className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl transition-all shadow-lg shadow-blue-500/20 active:scale-95 flex justify-center items-center gap-2 text-[1rem] disabled:opacity-50 disabled:cursor-not-allowed">
                      {isSaving ? <i className="ph-bold ph-spinner ph-spin text-xl"></i> : currentT.save}
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {isAnnModalOpen && (
            <div role="dialog" aria-modal="true" aria-label={currentT.announcementSetup} className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md bottom-sheet animate-in fade-in">
              <div className={`rounded-[2.5rem] shadow-2xl w-full max-w-lg p-6 sm:p-8 relative animate-in zoom-in-95 sm:zoom-in-100 duration-300 ${isDarkMode ? 'bg-slate-800' : 'bg-white'}`}>
                <div className="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mb-6 sm:hidden"></div>

                    <div className="space-y-2"><label className="text-[0.7rem] font-bold opacity-60 uppercase tracking-wider ml-1">{currentT.annMs}</label><input type="text" value={announcement.ms} onChange={e => setAnnouncement({...announcement, ms: e.target.value})} className={`w-full border rounded-2xl px-5 py-4 outline-none font-medium focus:ring-2 focus:ring-amber-500 ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`} /></div>
                  </div>
                  <button type="submit" disabled={isSaving || isOffline} className="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl mt-8 shadow-lg shadow-amber-500/20 active:scale-95 flex justify-center items-center gap-2 transition-transform disabled:opacity-50 disabled:cursor-not-allowed">{isSaving ? <i className="ph-bold ph-spinner ph-spin text-xl"></i> : currentT.save}</button>
                </form>
              </div>
            </div>
          )}

          {isEventModalOpen && (
            <div role="dialog" aria-modal="true" aria-label={currentT.eventSetup} className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md bottom-sheet animate-in fade-in">
              <div className={`rounded-[2.5rem] shadow-2xl w-full max-w-lg p-6 sm:p-8 relative animate-in zoom-in-95 sm:zoom-in-100 duration-300 ${isDarkMode ? 'bg-slate-800' : 'bg-white'}`}>
                <div className="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mb-6 sm:hidden"></div>
                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-extrabold tracking-tight flex items-center gap-2"><i className="ph-fill ph-calendar text-emerald-500 text-2xl"></i> {currentT.eventSetup}</h2><button onClick={() => setIsEventModalOpen(false)} className={`p-2 rounded-full ${isDarkMode ? 'bg-slate-700' : 'bg-slate-100'}`}><i className="ph-bold ph-x text-lg"></i></button></div>
                <form onSubmit={(e) => handleSaveSetting(e, 'event', schoolEvent, setIsEventModalOpen)} className="space-y-6 pb-safe">
                  <label className={`flex items-center gap-3 p-5 border rounded-[1.5rem] cursor-pointer ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-slate-50 border-slate-200'}`}><input type="checkbox" checked={schoolEvent.active} onChange={e => { vibrate(20); setSchoolEvent({...schoolEvent, active: e.target.checked});}} className="w-5 h-5 accent-emerald-500" /><span className="font-bold">启用倒计时 / Aktifkan Countdown</span></label>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-2"><label className="text-[0.7rem] font-bold opacity-60 uppercase tracking-wider ml-1">{currentT.eventTitleZh}</label><input type="text" value={schoolEvent.zh} onChange={e => setSchoolEvent({...schoolEvent, zh: e.target.value})} className={`w-full border rounded-2xl px-5 py-4 outline-none font-medium focus:ring-2 focus:ring-emerald-500 ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`} placeholder="如: UASA 考试" /></div>
                    <div className="space-y-2"><label className="text-[0.7rem] font-bold opacity-60 uppercase tracking-wider ml-1">{currentT.eventTitleMs}</label><input type="text" value={schoolEvent.ms} onChange={e => setSchoolEvent({...schoolEvent, ms: e.target.value})} className={`w-full border rounded-2xl px-5 py-4 outline-none font-medium focus:ring-2 focus:ring-emerald-500 ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`} placeholder="Cth: Peperiksaan UASA" /></div>
                    <div className="col-span-2 space-y-2"><label className="text-[0.7rem] font-bold opacity-60 uppercase tracking-wider ml-1">{currentT.eventDate}</label><input type="date" value={schoolEvent.date} onChange={e => setSchoolEvent({...schoolEvent, date: e.target.value})} className={`w-full border rounded-2xl px-5 py-4 outline-none font-bold focus:ring-2 focus:ring-emerald-500 ${isDarkMode ? 'bg-slate-900/50 border-slate-700 [color-scheme:dark]' : 'bg-white border-slate-200 shadow-sm'}`} /></div>
                  </div>
                  <button type="submit" disabled={isSaving || isOffline} className="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl mt-8 shadow-lg shadow-emerald-500/20 active:scale-95 flex justify-center items-center gap-2 transition-transform disabled:opacity-50 disabled:cursor-not-allowed">{isSaving ? <i className="ph-bold ph-spinner ph-spin text-xl"></i> : currentT.save}</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
