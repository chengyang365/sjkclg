    .animate-float-delayed { animation: float-delayed 15s ease-in-out infinite 2s; }

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-500 flex flex-col min-h-screen">
  <div id="root" class="flex flex-col flex-1"></div>

  <script type="text/babel" data-presets="react" data-type="module">
    import React, { useState, useMemo, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { QRCodeSVG } from 'qrcode.react';

    // 触觉反馈
    const vibrate = (ms = 40) => {
      if (typeof window !== 'undefined' && window.navigator && window.navigator.vibrate) window.navigator.vibrate(ms);
    };

    // ==========================================
    // Fetch API 真实后端联调器 (针对 Netlify 部署)
    // ==========================================
    
    // 🔴 步骤1: 请在这里填入您在 Google Apps Script 部署后得到的 Web App URL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbypof7i8UG4x4GxEaT5Mw5u_WPtvJHTT9FYnX0lGtgklahugJtfaRtPipKGc9jxrLrP/exec";

    // 🔴 步骤2: 隐藏的管理员密码
    const ADMIN_PIN = "8888"; 

    // 真正的去中心化请求 (无本地 Mock 数据)
    const apiRequest = async (action, data = {}) => {
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({ action, data })
        });
        const result = await response.json();
        if (result.status === 'success') return result.data;
        else throw new Error(result.message);
      } catch (error) {
        console.error("API Request Failed:", error);
        throw error;
      }
    };

    const server = {
      getInitialData: () => apiRequest('getInitialData', {}),
      saveApp: (data) => apiRequest('saveApp', data),
      deleteApp: (id) => apiRequest('deleteApp', { id }),
      recordClick: (id) => apiRequest('recordClick', { id }),
      updateAppOrders: (orders) => apiRequest('updateAppOrders', { orders }),
      saveSettings: (key, val) => apiRequest('saveSettings', { key, val })
    };

    const AnimatedNumber = ({ value }) => {
      const [displayValue, setDisplayValue] = useState(0);
      useEffect(() => {
        let start = 0; const duration = 1000; const increment = value / (duration / 16);
        const timer = setInterval(() => {
          start += increment;
          if (start >= value) { clearInterval(timer); setDisplayValue(value); } 
          else { setDisplayValue(Math.floor(start)); }
        }, 16);
        return () => clearInterval(timer);
      }, [value]);
      return <span>{displayValue.toLocaleString()}</span>;
    };

    const Toast = ({ message, type, isVisible }) => {
      if (!isVisible) return null;
      const bgClass = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-rose-500' : 'bg-blue-600';
      const icon = type === 'success' ? 'ph-check-circle' : type === 'error' ? 'ph-warning-circle' : 'ph-info';
      return (
        <div className="fixed sm:top-24 bottom-24 sm:bottom-auto left-1/2 -translate-x-1/2 z-[250] animate-in slide-in-from-bottom-10 sm:slide-in-from-top-10 fade-in duration-300 pointer-events-none">
          <div className={`${bgClass} text-white px-5 py-3 rounded-full shadow-2xl font-bold text-sm flex items-center gap-2 backdrop-blur-xl bg-opacity-95 border border-white/20`}>
            <i className={`ph-fill ${icon} text-lg`}></i> {message}
          </div>
        </div>
      );
    };

    const t = {
      zh: {
        schoolName: '新廊华小', appTitle: '应用中心', searchPlaceholder: '搜索内部系统...', adminActive: '系统管理',
        tabs: { all: '全部应用', pinned: '我的置顶', admin: '行政', kurikulum: '课程', hem: '学生事务', koko: '兼修课程', other: '其他' },
        categories: { pinned: '我的置顶', admin: '行政管理 (Pentadbiran)', kurikulum: '课程与教学 (Kurikulum)', hem: '学生事务 (HEM)', koko: '兼修课程 (Kokurikulum)', other: '其他系统 (Lain-lain)' },
        addApp: '添加内部系统', editApp: '编辑系统', save: '保存同步', cancel: '取消', emptyState: '此分类下暂无系统', noResult: '未找到匹配的系统',
        announcementSetup: '内部通告设置', annActive: '开启通告横幅', annZh: '中文内容', annMs: '马来文内容',
        eventSetup: '倒计时设置', eventTitleZh: '事件名称 (中)', eventTitleMs: '事件名称 (马)', eventDate: '目标日期',
        countdown: '校务倒计时', daysLeft: '天', todayIs: '就是今天！', passed: '已结束',
        toastSaved: '已同步', toastDeleted: '应用已删除', toastPinned: '已加入置顶', toastUnpinned: '已取消置顶',
        offlineMsg: '未连接到云端，正使用本地缓存。', searchResults: '搜索结果', recentAccess: '最近访问',
        pinTitle: '输入系统密码', pinPlaceholder: '••••', pinError: '密码错误，请重试', unlock: '解锁', copied: '已复制链接', copyFailed: '复制失败'
      },
      ms: {
        schoolName: 'SJK (C) Ladang Grisek', appTitle: 'Pusat Aplikasi', searchPlaceholder: 'Cari sistem...', adminActive: 'Tadbir Sistem',
        tabs: { all: 'Semua App', pinned: 'Dipin', admin: 'Pentadbiran', kurikulum: 'Kurikulum', hem: 'HEM', koko: 'Koko', other: 'Lain-lain' },
        categories: { pinned: 'Dipinkan', admin: 'Pentadbiran', kurikulum: 'Kurikulum', hem: 'Hal Ehwal Murid', koko: 'Kokurikulum', other: 'Lain-lain' },
        addApp: 'Tambah Sistem', editApp: 'Edit Sistem', save: 'Simpan', cancel: 'Batal', emptyState: 'Tiada sistem buat masa ini', noResult: 'Sistem tidak dijumpai',
        announcementSetup: 'Tetapan Notis', annActive: 'Aktifkan Banner', annZh: 'Notis (Cina)', annMs: 'Notis (Melayu)',
        eventSetup: 'Tetapan Countdown', eventTitleZh: 'Acara (Cina)', eventTitleMs: 'Acara (Melayu)', eventDate: 'Tarikh',
        countdown: 'Kiraan Detik', daysLeft: 'Hari Lagi', todayIs: 'Hari ini!', passed: 'Telah Berlalu',
        toastSaved: 'Berjaya disegerakkan', toastDeleted: 'Telah dipadam', toastPinned: 'Telah dipin', toastUnpinned: 'Pin dibuang',
        offlineMsg: 'Tiada sambungan internet. Mod luar talian aktif.', searchResults: 'Hasil Carian', recentAccess: 'Baru Digunakan',
        pinTitle: 'Masukkan PIN', pinPlaceholder: '••••', pinError: 'PIN salah, cuba lagi', unlock: 'Buka', copied: 'Pautan disalin', copyFailed: 'Gagal disalin'
      }
    };

    const iconMap = {
      Settings: 'ph-gear', Users: 'ph-users', MonitorPlay: 'ph-monitor-play', BookOpen: 'ph-book-open', GraduationCap: 'ph-graduation-cap', 
      Library: 'ph-books', LayoutDashboard: 'ph-squares-four', Globe: 'ph-globe', Chart: 'ph-chart-bar', Folder: 'ph-folder', 
      Calendar: 'ph-calendar', Megaphone: 'ph-megaphone', Clock: 'ph-clock', Printer: 'ph-printer', ShieldCheck: 'ph-shield-check', 
      Chalkboard: 'ph-chalkboard', Video: 'ph-video', FileText: 'ph-file-text', Exam: 'ph-exam', Math: 'ph-calculator',
      Science: 'ph-flask', Sport: 'ph-basketball', Art: 'ph-palette', Music: 'ph-music-notes', Code: 'ph-code', Translate: 'ph-translate', 
      Trophy: 'ph-trophy', Link: 'ph-link', Envelope: 'ph-envelope', Cloud: 'ph-cloud'
    };

    const CustomIconSelect = ({ value, onChange, isDarkMode }) => {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => { if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false); };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <div ref={dropdownRef} className="relative w-full z-50">
          <button type="button" onClick={() => setIsOpen(!isOpen)} className={`w-full flex items-center justify-between border rounded-2xl px-5 py-4 font-bold outline-none transition-all ${isDarkMode ? 'bg-slate-800 hover:bg-slate-700 border-slate-700' : 'bg-slate-50 hover:bg-slate-100 border-slate-200'} ${isOpen ? 'ring-2 ring-blue-500 border-blue-500' : ''}`}>
            <div className="flex items-center gap-3">
              <div className={`w-8 h-8 rounded-lg flex items-center justify-center shadow-sm ${isDarkMode ? 'bg-slate-700 text-blue-400' : 'bg-white text-blue-600'}`}>
                <i className={`ph-fill ${iconMap[value] || 'ph-squares-four'} text-xl`}></i>
              </div>
              <span>{value || 'Default'}</span>
            </div>
            <i className={`ph-bold ph-caret-down transition-transform ${isOpen ? 'rotate-180' : ''}`}></i>
          </button>
          {isOpen && (
            <div className={`absolute top-full left-0 w-full mt-2 rounded-2xl shadow-2xl border overflow-hidden animate-in slide-in-from-top-2 fade-in duration-200 ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
              <ul className="max-h-60 overflow-y-auto hide-scrollbar p-2 grid grid-cols-1 sm:grid-cols-2 gap-1">
                {Object.keys(iconMap).map(iconName => (
                  <li key={iconName} onClick={() => { onChange(iconName); setIsOpen(false); vibrate(15); }} className={`flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer font-bold transition-colors ${value === iconName ? (isDarkMode ? 'bg-blue-600/20 text-blue-400' : 'bg-blue-50 text-blue-700') : (isDarkMode ? 'hover:bg-slate-700 text-slate-300' : 'hover:bg-slate-50 text-slate-700')}`}>
                    <div className={`w-8 h-8 rounded-lg flex items-center justify-center shadow-sm ${value === iconName ? (isDarkMode ? 'bg-blue-500/20 text-blue-400' : 'bg-white text-blue-600') : (isDarkMode ? 'bg-slate-700 text-slate-400' : 'bg-slate-100 text-slate-500')}`}><i className={`ph-fill ${iconMap[iconName]} text-xl`}></i></div>
                    <span className="text-sm truncate">{iconName}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    };

    const renderIcon = (iconVal, isList) => {
      const sizeClass = isList ? 'text-[1.5rem]' : 'text-[1.8rem] sm:text-[2.2rem]';
      if (!iconVal) return <i className={`ph-fill ph-squares-four ${sizeClass}`}></i>;
      if (iconVal.startsWith('http') || iconVal.startsWith('data:image')) return <img src={iconVal} alt="icon" className="w-full h-full object-cover rounded-[inherit] scale-[0.85]" />;
      if (iconMap[iconVal]) return <i className={`ph-fill ${iconMap[iconVal]} ${sizeClass}`}></i>;
      return <span className={isList ? 'text-[1.5rem]' : 'text-[1.8rem] sm:text-[2.2rem]'}>{iconVal}</span>;
    };

    // 智能实时时钟钩子，时间中加入不换行空格（\u00A0）
    const useSmartClock = (lang) => {
      const [time, setTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      return useMemo(() => {
        const h = time.getHours();
        const m = time.getMinutes().toString().padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        const displayH = h % 12 || 12;
        const timeStr = `${displayH}:${m}\u00A0${ampm}`;

        const year = time.getFullYear();
        const month = time.getMonth() + 1;
        const date = time.getDate();
        const dayIdx = time.getDay();

        if (lang === 'zh') {
          const daysZh = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
          return `${year}年${month}月${date}日 ${daysZh[dayIdx]} ${timeStr}`;
        } else {
          const daysMs = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
          const monthsMs = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogos', 'Sep', 'Okt', 'Nov', 'Dis'];
          return `${daysMs[dayIdx]}, ${date} ${monthsMs[month - 1]} ${year} ${timeStr}`;
        }
      }, [time, lang]);
    };

    const getAmbientClasses = (isDarkMode) => {
      const h = new Date().getHours();
      if (h >= 5 && h < 12) return isDarkMode ? ['bg-orange-900/10', 'bg-amber-900/10'] : ['bg-orange-400/20', 'bg-amber-400/20'];
      if (h >= 12 && h < 17) return isDarkMode ? ['bg-blue-900/10', 'bg-cyan-900/10'] : ['bg-blue-400/20', 'bg-cyan-400/20'];
      if (h >= 17 && h < 19) return isDarkMode ? ['bg-purple-900/10', 'bg-rose-900/10'] : ['bg-purple-400/20', 'bg-rose-400/20'];
      return isDarkMode ? ['bg-indigo-900/10', 'bg-blue-900/10'] : ['bg-indigo-400/20', 'bg-blue-400/20'];
    };

    function App() {
      const [isAdmin, setIsAdmin] = useState(() => {
        try { return localStorage.getItem('sjkc_superapp_admin') === 'true'; } catch { return false; }
      });
      useEffect(() => {
         if(isAdmin) localStorage.setItem('sjkc_superapp_admin', 'true');
         else localStorage.removeItem('sjkc_superapp_admin');
      }, [isAdmin]);

      const [clickCount, setClickCount] = useState(0);
      const clickTimeoutRef = useRef(null);
      const [showPinModal, setShowPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      const handleLogoClick = () => {
        if (isAdmin) { setIsAdmin(false); return; }
        setClickCount(prev => prev + 1);
        if (clickTimeoutRef.current) clearTimeout(clickTimeoutRef.current);
        clickTimeoutRef.current = setTimeout(() => setClickCount(0), 1000);
      };

      useEffect(() => { if (clickCount >= 5) { setShowPinModal(true); setClickCount(0); } }, [clickCount]);

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === ADMIN_PIN) { setIsAdmin(true); setShowPinModal(false); setPinInput(''); setPinError(false); vibrate(50);} 
        else { setPinError(true); setPinInput(''); vibrate([30,50,30]);}
      };

      const [apps, setApps] = useState([]);
      const [announcement, setAnnouncement] = useState({ active: false, zh: '', ms: '' });
      const [schoolEvent, setSchoolEvent] = useState({ active: false, zh: '', ms: '', date: '' });
      const [loading, setLoading] = useState(true);
      const [isSyncing, setIsSyncing] = useState(false);
      
      const [lang, setLang] = useState('zh');
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeTab, setActiveTab] = useState('all');
      
      const currentDateTimeStr = useSmartClock(lang);

      const [viewMode, setViewMode] = useState(() => {
        try { return localStorage.getItem('sjkc_view_mode') || 'grid'; } catch { return 'grid'; }
      });
      useEffect(() => { localStorage.setItem('sjkc_view_mode', viewMode); }, [viewMode]);

      const [isOffline, setIsOffline] = useState(!navigator.onLine);
      useEffect(() => {
        const handleOnline = () => { setIsOffline(false); setIsSyncing(true); server.getInitialData().then(() => setIsSyncing(false)).catch(()=>{setIsSyncing(false);}); };
        const handleOffline = () => setIsOffline(true);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); };
      }, []);

      const [recentIds, setRecentIds] = useState(() => {
        try { return JSON.parse(localStorage.getItem('sjkc_recent_apps') || '[]'); } catch { return []; }
      });

      const [toast, setToast] = useState({ visible: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => {
        vibrate(type === 'error' ? [30, 50, 30] : 30);
        setToast({ visible: true, message, type });
        setTimeout(() => setToast(t => ({ ...t, visible: false })), 3000);
      };

      const [showInstallPrompt, setShowInstallPrompt] = useState(false);
      const [isIOS, setIsIOS] = useState(false);
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const [pinnedIds, setPinnedIds] = useState(() => {
        try { const saved = localStorage.getItem('sjkc_superapp_pinned'); return saved ? JSON.parse(saved) : []; } catch { return []; }
      });
      useEffect(() => { localStorage.setItem('sjkc_superapp_pinned', JSON.stringify(pinnedIds)); }, [pinnedIds]);

      const [isAppModalOpen, setIsAppModalOpen] = useState(false);
      const [isAnnModalOpen, setIsAnnModalOpen] = useState(false);
      const [isEventModalOpen, setIsEventModalOpen] = useState(false);
      const [isDataModalOpen, setIsDataModalOpen] = useState(false); 
      const [qrApp, setQrApp] = useState(null);
      
      const [isFabOpen, setIsFabOpen] = useState(false);
      
      const [editingApp, setEditingApp] = useState(null);
      const [formData, setFormData] = useState({ url: '', icon: 'Settings', category: 'admin', zhTitle: '', zhDesc: '', msTitle: '', msDesc: '' });
      const [isCustomIcon, setIsCustomIcon] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      const [shortcutKey, setShortcutKey] = useState('⌘K');
      useEffect(() => {
        if (navigator.userAgent.indexOf('Win') !== -1 || navigator.userAgent.indexOf('Linux') !== -1) {
          setShortcutKey('Ctrl+K');
        } else {
          setShortcutKey('⌘K');
        }
      }, []);

      const currentT = t[lang];

      const searchInputRef = useRef(null);
      const [isSearchFocused, setIsSearchFocused] = useState(false);
      const [kbIndex, setKbIndex] = useState(-1);

      const filteredApps = useMemo(() => {
        const s = searchQuery.toLowerCase();
        if (!s) return apps;
        return apps.filter(app => app.zhTitle?.toLowerCase().includes(s) || app.msTitle?.toLowerCase().includes(s) || app.zhDesc?.toLowerCase().includes(s) || app.msDesc?.toLowerCase().includes(s));
      }, [apps, searchQuery]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchInputRef.current?.focus(); return; }
          
          if (isSearchFocused && searchQuery) {
            if (e.key === 'ArrowDown') {
              e.preventDefault();
              setKbIndex(prev => Math.min(prev + 1, filteredApps.length - 1));
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              setKbIndex(prev => Math.max(prev - 1, 0));
            } else if (e.key === 'Enter') {
              e.preventDefault();
              if (kbIndex >= 0 && filteredApps[kbIndex]) {
                const targetApp = filteredApps[kbIndex];
                handleAppClick(null, targetApp);
                window.open(targetApp.url, '_blank');
              }
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isSearchFocused, searchQuery, filteredApps, kbIndex]);

      useEffect(() => { setKbIndex(searchQuery ? 0 : -1); }, [searchQuery]);

      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      useEffect(() => {
        const cachedData = localStorage.getItem('sjkc_staff_cache');
        if (cachedData) {
          try {
            const parsed = JSON.parse(cachedData);
            setApps(parsed.apps || []);
            if (parsed.settings) {
              if (parsed.settings.announcement) setAnnouncement(parsed.settings.announcement);
              if (parsed.settings.event) setSchoolEvent(parsed.settings.event);
            }
            setLoading(false); setIsSyncing(true); 
          } catch(e) {}
        }

        if (!isOffline) {
          server.getInitialData().then(res => {
            let loadedApps = res.apps || [];
            loadedApps.sort((a, b) => (a.order || 0) - (b.order || 0));
            loadedApps = loadedApps.map(a => ({
              ...a, zh: { title: a.zhTitle, desc: a.zhDesc }, ms: { title: a.msTitle, desc: a.msDesc }, clicks: parseInt(a.clicks) || 0
            }));
            setApps(loadedApps);
            if (res.settings) {
              if (res.settings.announcement) setAnnouncement(res.settings.announcement);
              if (res.settings.event) setSchoolEvent(res.settings.event);
            }
            setLoading(false); setIsSyncing(false);
            localStorage.setItem('sjkc_staff_cache', JSON.stringify({ apps: loadedApps, settings: res.settings }));
          }).catch(err => {
            console.error("无法连接到云端数据库:", err);
            setLoading(false); setIsSyncing(false);
          });
        }

        const isIosDevice = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
        if (isIosDevice && !window.navigator.standalone && !localStorage.getItem('sjkc_pwa_ios')) {
          setIsIOS(true); setShowInstallPrompt(true);
        }
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); setDeferredPrompt(e); setShowInstallPrompt(true); });
      }, [isOffline]);

      const handleInstallClick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') setShowInstallPrompt(false);
          setDeferredPrompt(null);
        } else if (isIOS) {
          setShowInstallPrompt(false);
          localStorage.setItem('sjkc_superapp_ios_prompted', 'true');
        }
      };

      const handleDismissPrompt = () => {
        setShowInstallPrompt(false);
        if (isIOS) localStorage.setItem('sjkc_superapp_ios_prompted', 'true');
      };

      const togglePin = (e, appId) => {
        e.preventDefault(); e.stopPropagation(); vibrate(20);
        const isPinned = pinnedIds.includes(appId);
        setPinnedIds(prev => isPinned ? prev.filter(id => id !== appId) : [...prev, appId]);
        showToast(isPinned ? currentT.toastUnpinned : currentT.toastPinned, 'info');
      };

      const handleAppClick = (e, app) => {
        setRecentIds(prev => {
          const newRecent = [app.id, ...prev.filter(id => id !== app.id)].slice(0, 4);
          localStorage.setItem('sjkc_recent_apps', JSON.stringify(newRecent));
          return newRecent;
        });

        if (!isOffline) {
          setApps(apps.map(a => a.id === app.id ? { ...a, clicks: a.clicks + 1 } : a));
          server.recordClick(app.id);
        }
      };

      // 🔥 新增：底层兼容的复制链接函数
      const handleCopyUrl = (url) => {
        vibrate(20);
        try {
          const textArea = document.createElement("textarea");
          textArea.value = url;
          // 防止手机屏幕滚动
          textArea.style.top = "0";
          textArea.style.left = "0";
          textArea.style.position = "fixed";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(textArea);
          if (successful) {
             showToast(currentT.copied, 'success');
          } else {
             showToast(currentT.copyFailed, 'error');
          }
        } catch (err) {
          showToast(currentT.copyFailed, 'error');
        }
      };

      const ConfirmModal = ({ isOpen, onClose, onConfirm, title, desc }) => {
        if (!isOpen) return null;
        return (
          <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md animate-in fade-in duration-200" onClick={onClose}>
            <div className={`rounded-[2.5rem] shadow-2xl w-full max-w-sm p-8 flex flex-col items-center animate-in zoom-in-95 duration-300 ${isDarkMode ? 'bg-slate-800 border border-slate-700' : 'bg-white border border-slate-100'}`} onClick={e=>e.stopPropagation()}>
              <div className="w-16 h-16 rounded-[1.5rem] bg-rose-500/10 text-rose-500 flex items-center justify-center mb-6 shadow-inner"><i className="ph-fill ph-trash text-3xl"></i></div>
              <h3 className={`text-[1.35rem] font-extrabold tracking-tight mb-2 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>{title}</h3>
              <p className={`text-[0.875rem] font-medium text-center mb-8 leading-relaxed opacity-80 ${isDarkMode ? 'text-slate-300' : 'text-slate-500'}`}>{desc}</p>
              <div className="flex gap-3 w-full">
                <button onClick={onClose} className={`flex-1 py-3.5 font-bold rounded-[1rem] transition-colors ${isDarkMode ? 'bg-slate-700 hover:bg-slate-600 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>{currentT.cancel}</button>
                <button onClick={() => { vibrate(40); onConfirm(); }} className="flex-1 py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-[1rem] shadow-lg shadow-rose-500/30 active:scale-95 transition-all">确认删除</button>
              </div>
            </div>
          </div>
        );
      };
      
      const [appToDelete, setAppToDelete] = useState(null);
      const handleDeleteConfirm = async () => {
        if (appToDelete) {
          setApps(apps.filter(a => a.id !== appToDelete));
          setPinnedIds(prev => prev.filter(pId => pId !== appToDelete));
          if(!isOffline) server.deleteApp(appToDelete);
          showToast(currentT.toastDeleted, 'error');
          setAppToDelete(null);
        }
      };

      const [draggedApp, setDraggedApp] = useState(null);
      const handleDragStart = (e, app) => {
        if (!isAdmin) return; vibrate(20);
        setDraggedApp(app); e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => { e.target.style.opacity = '0.5'; e.target.style.transform = 'scale(0.95)'; }, 0);
      };
      const handleDragEnd = (e) => { 
        e.target.style.opacity = '1'; e.target.style.transform = 'scale(1)'; setDraggedApp(null); 
      };
      const handleDrop = async (e, targetApp) => {
        e.preventDefault();
        if (!isAdmin || !draggedApp || draggedApp.id === targetApp.id || draggedApp.category !== targetApp.category) return;
        vibrate(30);
        const categoryApps = apps.filter(a => a.category === targetApp.category);
        const draggedIdx = categoryApps.findIndex(a => a.id === draggedApp.id);
        const targetIdx = categoryApps.findIndex(a => a.id === targetApp.id);
        const newCategoryApps = [...categoryApps];
        newCategoryApps.splice(draggedIdx, 1);
        newCategoryApps.splice(targetIdx, 0, draggedApp);
        const newApps = apps.map(a => {
           if(a.category !== targetApp.category) return a;
           const newOrderIndex = newCategoryApps.findIndex(na => na.id === a.id);
           return { ...a, order: newOrderIndex };
        }).sort((a, b) => a.order - b.order);
        
        setApps(newApps);
        if(!isOffline) {
          const orders = newCategoryApps.map((a, idx) => ({ id: a.id, order: idx }));
          server.updateAppOrders(orders);
        }
      };

      const handleSaveApp = async (e) => {
        e.preventDefault(); setIsSaving(true);
        const newId = editingApp ? editingApp.id : Date.now().toString();
        const appData = { ...formData, id: newId, order: editingApp ? editingApp.order : apps.filter(a => a.category === formData.category).length, clicks: editingApp ? editingApp.clicks : 0, createdAt: editingApp ? editingApp.createdAt : Date.now() };
        const frontendApp = { ...appData, zh: { title: appData.zhTitle, desc: appData.zhDesc }, ms: { title: appData.msTitle, desc: appData.msDesc } };
        
        setApps(editingApp ? apps.map(a => a.id === newId ? frontendApp : a) : [...apps, frontendApp]);
        setIsAppModalOpen(false); setIsFabOpen(false);
        if(!isOffline) await server.saveApp(appData);
        setIsSaving(false); showToast(isOffline ? '保存至本地缓存，联网后同步' : currentT.toastSaved, isOffline ? 'error' : 'success');
      };

      const handleSaveSetting = async (e, type, data, setModal) => {
        e.preventDefault(); setIsSaving(true); setModal(false); setIsFabOpen(false);
        if(!isOffline) await server.saveSettings(type, data);
        setIsSaving(false); showToast(isOffline ? '保存至本地缓存，联网后同步' : currentT.toastSaved, isOffline ? 'error' : 'success');
      };

      const handleExportCSV = () => {
        vibrate(20);
        const headers = ['ID', 'Category', 'Chinese Title', 'Malay Title', 'Total Clicks'];
        const csvContent = [headers.join(','), ...apps.map(a => `${a.id},${a.category},"${a.zh?.title || ''}","${a.ms?.title || ''}",${a.clicks || 0}`)].join('\n');
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.setAttribute("href", URL.createObjectURL(blob));
        link.setAttribute("download", `Ladang_Grisek_Analytics_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const groupedApps = useMemo(() => {
        return { 
          pinned: filteredApps.filter(a => pinnedIds.includes(a.id)),
          admin: filteredApps.filter(a => a.category === 'admin'), 
          kurikulum: filteredApps.filter(a => a.category === 'kurikulum'), 
          hem: filteredApps.filter(a => a.category === 'hem'), 
          koko: filteredApps.filter(a => a.category === 'koko'), 
          other: filteredApps.filter(a => a.category === 'other') 
        };
      }, [filteredApps, pinnedIds]);

      const recentAppsList = useMemo(() => {
        return recentIds.map(id => apps.find(a => a.id === id)).filter(Boolean);
      }, [recentIds, apps]);

      const eventStatus = useMemo(() => {
        if (!schoolEvent.active || !schoolEvent.date) return null;
        const diff = new Date(schoolEvent.date).setHours(0,0,0,0) - new Date().setHours(0,0,0,0);
        const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
        if (days > 0) return { num: days, text: currentT.daysLeft, color: 'text-blue-500 dark:text-blue-400' };
        if (days === 0) return { num: '', text: currentT.todayIs, color: 'text-rose-500 dark:text-rose-400' };
        return { num: '', text: currentT.passed, color: 'text-slate-500' };
      }, [schoolEvent, currentT]);

      const dashboardStats = useMemo(() => {
        const totalApps = apps.length;
        const totalVisits = apps.reduce((sum, app) => sum + (app.clicks || 0), 0);
        const sortedApps = [...apps].sort((a, b) => (b.clicks || 0) - (a.clicks || 0)).slice(0, 5);
        const maxClicks = sortedApps.length > 0 ? sortedApps[0].clicks : 1; 
        const catMap = { 'admin':0, 'kurikulum':0, 'hem':0, 'koko':0, 'other':0 };
        apps.forEach(a => { if(catMap[a.category] !== undefined) catMap[a.category] += (a.clicks || 0); });
        return { totalApps, totalVisits, topApps: sortedApps, maxClicks, catMap };
      }, [apps]);

      const ambientClasses = getAmbientClasses(isDarkMode);

      const renderAppCard = (app, index, isPinnedSection = false, isSearchList = false) => {
        const isPinned = pinnedIds.includes(app.id);
        const showNewBadge = (Date.now() - app.createdAt) < (7 * 24 * 60 * 60 * 1000);
        const isList = viewMode === 'list' || isSearchList;
        const isKeyboardFocused = isSearchList && index === kbIndex;

        const handleMouseMove = (e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          e.currentTarget.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
          e.currentTarget.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        };

        return (
          <div 
            onMouseMove={handleMouseMove} key={isPinnedSection ? `pinned-${app.id}` : app.id}
            draggable={isAdmin && !isPinnedSection && activeTab === 'all' && !isSearchList} 
            onDragStart={(e) => (!isPinnedSection && activeTab === 'all' && !isSearchList) && handleDragStart(e, app)}
            onDragEnd={(!isPinnedSection && activeTab === 'all' && !isSearchList) ? handleDragEnd : undefined}
            onDragOver={(e) => { e.preventDefault(); }}
            onDrop={(e) => (!isPinnedSection && activeTab === 'all' && !isSearchList) && handleDrop(e, app)}
            className={`group spotlight-card relative transition-all duration-300 overflow-hidden outline outline-1 outline-transparent animate-waterfall
              ${isList ? 'flex flex-row items-center px-4 sm:px-5 py-3.5 sm:py-4 rounded-[1.2rem]' : 'flex flex-col items-center justify-start text-center p-3 sm:p-4 rounded-2xl h-full'}
              ${(isAdmin && !isPinnedSection && activeTab === 'all' && !isSearchList) ? 'cursor-grab active:cursor-grabbing' : ''} 
              ${isDarkMode ? 'bg-slate-800/50 backdrop-blur-2xl shadow-[inset_0_1px_1px_rgba(255,255,255,0.08)]' : 'bg-white/80 backdrop-blur-xl shadow-[0_2px_15px_rgb(0,0,0,0.03),inset_0_1px_1px_rgba(255,255,255,0.8)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)]'}
              ${isKeyboardFocused ? 'ring-2 ring-blue-500 shadow-xl scale-[1.02]' : isDarkMode ? 'hover:ring-1 hover:ring-slate-600' : 'hover:ring-1 hover:ring-blue-100/50'}
              ${!isList && 'hover:-translate-y-1 active:scale-[0.98]'} 
              ${isList && !isKeyboardFocused && 'hover:scale-[1.01] active:scale-[0.99]'}`}
            style={{ animationDelay: `${index * 30}ms` }}
          >
            <a href={app.url} target="_blank" rel="noopener noreferrer" onClick={(e) => handleAppClick(e, app)} className={`flex-1 flex cursor-pointer z-10 no-underline w-full ${isList ? 'flex-row items-center gap-4 sm:gap-5 pr-10 sm:pr-0' : 'flex-col items-center justify-start gap-2 sm:gap-3'}`}>
              <div className={`${isList ? 'w-12 h-12 rounded-[0.9rem]' : 'w-11 h-11 sm:w-14 sm:h-14 rounded-xl'} flex items-center justify-center relative shadow-sm transition-transform duration-300 group-hover:scale-105 group-active:scale-95 shrink-0
                ${isDarkMode ? 'bg-gradient-to-b from-slate-700 to-slate-800 border border-slate-600 text-blue-400 group-hover:border-blue-500 group-hover:text-blue-300 group-hover:shadow-[0_0_20px_rgba(59,130,246,0.3)]' : 'bg-gradient-to-b from-white to-blue-50/50 border border-blue-100/50 text-blue-600 group-hover:border-blue-200 group-hover:shadow-blue-500/20'}`}>
                {renderIcon(app.icon, isList)}
                {showNewBadge && <span className="absolute -top-1 -right-1 sm:-top-1.5 sm:-right-1.5 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow-md animate-pulse flex items-center gap-0.5 border border-white dark:border-slate-800"><i className="ph-fill ph-sparkle"></i></span>}
              </div>
              
              <div className={`flex-1 min-w-0 flex flex-col justify-center w-full ${isList ? 'text-left' : 'text-center items-center mt-1 sm:mt-2'}`}>
                <div className={`flex items-center gap-2 ${isList ? 'justify-start' : 'justify-center w-full'}`}>
                  <h3 className={`font-extrabold tracking-tight ${isList ? 'text-[1.05rem] mb-0.5' : 'text-[0.7rem] sm:text-[0.8rem] leading-tight line-clamp-2'} w-full ${isDarkMode ? 'text-slate-100 group-hover:text-blue-400' : 'text-slate-800 group-hover:text-blue-600'}`}>{app[lang]?.title || ''}</h3>
                  {isKeyboardFocused && isList && <span className="hidden sm:flex text-[0.6rem] font-bold px-1.5 py-0.5 rounded bg-blue-500 text-white animate-pulse shrink-0">↵ Enter</span>}
                </div>
                {isList && <p className={`text-[0.85rem] font-medium leading-relaxed opacity-75 mt-0.5 ${isDarkMode ? 'text-slate-300' : 'text-slate-500'}`}>{app[lang]?.desc || ''}</p>}
              </div>
            </a>
            
            {/* 列表模式下的控制区 (包含置顶和QR) */}
            {isList && (
              <div className="flex items-center gap-1 sm:gap-2 ml-2 sm:ml-4 sm:opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                <button onClick={(e) => togglePin(e, app.id)} className={`p-2.5 rounded-xl transition-colors ${isPinned ? 'text-amber-500 bg-amber-50 dark:bg-amber-900/30' : 'text-slate-400 hover:text-amber-500 hover:bg-slate-100 dark:hover:bg-slate-700'}`}><i className={`ph-fill ph-star text-[1.1rem] sm:text-lg ${isPinned ? 'drop-shadow-sm' : ''}`}></i></button>
                <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); vibrate(20); setQrApp(app); }} className="p-2.5 rounded-xl text-slate-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-slate-700 transition-colors"><i className="ph-bold ph-qr-code text-[1.1rem] sm:text-lg"></i></button>
                {isAdmin && !isPinnedSection && (
                  <div className="hidden sm:flex items-center gap-1 pl-3 border-l border-slate-200 dark:border-slate-700">
                    <button onClick={(e) => { e.preventDefault(); setEditingApp(app); setFormData({...app, zhTitle: app.zh?.title, zhDesc: app.zh?.desc, msTitle: app.ms?.title, msDesc: app.ms?.desc, icon: app.icon||'Settings'}); setIsCustomIcon(!iconMap[app.icon||'Settings']); setIsAppModalOpen(true); }} className="p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-slate-700 transition-colors"><i className="ph-fill ph-pencil-simple text-lg"></i></button>
                    <button onClick={(e) => { e.preventDefault(); vibrate(40); setAppToDelete(app.id); }} className="p-2 rounded-xl text-slate-500 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-slate-700 transition-colors"><i className="ph-fill ph-trash text-lg"></i></button>
                  </div>
                )}
              </div>
            )}

            {/* 网格模式下管理员编辑按钮（手机常显，电脑悬停） */}
            {!isList && isAdmin && !isPinnedSection && (
              <div className={`flex absolute -top-1 -right-1 sm:top-1 sm:right-1 items-center gap-1 opacity-100 sm:opacity-0 group-hover:opacity-100 p-1 rounded-xl z-20 shadow-sm backdrop-blur-xl ${isDarkMode ? 'bg-slate-800/95 border-slate-600' : 'bg-white/95 border-slate-100'}`}>
                <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); setEditingApp(app); setFormData({...app, zhTitle: app.zh?.title, zhDesc: app.zh?.desc, msTitle: app.ms?.title, msDesc: app.ms?.desc, icon: app.icon||'Settings'}); setIsCustomIcon(!iconMap[app.icon||'Settings']); setIsAppModalOpen(true); }} className="p-1 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-slate-700 dark:hover:text-blue-400 transition-colors"><i className="ph-fill ph-pencil-simple text-[1rem] sm:text-sm"></i></button>
                <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); vibrate(40); setAppToDelete(app.id); }} className="p-1 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-slate-700 dark:hover:text-rose-400 transition-colors"><i className="ph-fill ph-trash text-[1rem] sm:text-sm"></i></button>
              </div>
            )}
          </div>
        );
      };

      return (
        <div className="min-h-screen relative overflow-x-hidden flex flex-col">
          <Toast {...toast} />
          <ConfirmModal isOpen={!!appToDelete} onClose={() => setAppToDelete(null)} onConfirm={handleDeleteConfirm} title="删除系统" desc="确定要从云端删除此系统卡片吗？该操作不可恢复。" />

          {/* 隐藏的管理员密码输入框 */}
          {showPinModal && (
            <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md transition-all animate-in fade-in">
              <div className={`rounded-[2rem] shadow-2xl w-full max-w-sm p-8 animate-in zoom-in-95 duration-200 ${isDarkMode ? 'bg-slate-800 border border-slate-700 text-white' : 'bg-white border border-slate-100 text-slate-800'}`}>
                <div className="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center mx-auto mb-6 text-blue-500"><i className="ph-bold ph-lock-key text-[2rem]"></i></div>
                <h2 className="text-xl font-extrabold text-center mb-6">{currentT.pinTitle}</h2>
                <form onSubmit={handlePinSubmit}>
                  <input type="password" autoFocus required value={pinInput} onChange={e => {setPinInput(e.target.value); setPinError(false);}} className={`w-full text-center tracking-[0.8em] text-2xl font-black border-2 rounded-2xl py-4 focus:outline-none transition-all ${pinError ? 'border-rose-500 bg-rose-500/10 text-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.2)]' : isDarkMode ? 'bg-slate-900/50 border-slate-700 focus:border-blue-500 text-white' : 'bg-slate-50 border-slate-200 focus:border-blue-500 focus:bg-white shadow-inner'}`} placeholder={currentT.pinPlaceholder} maxLength={4} />
                  {pinError && <p className="text-rose-500 text-[0.85rem] text-center mt-3 font-bold animate-bounce">{currentT.pinError}</p>}
                  <div className="flex gap-3 mt-8">
                    <button type="button" onClick={() => {setShowPinModal(false); setPinError(false); setPinInput('');}} className={`flex-1 py-3.5 font-bold rounded-xl transition-colors ${isDarkMode ? 'bg-slate-700/50 hover:bg-slate-600 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>{currentT.cancel}</button>
                    <button type="submit" className="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 active:scale-95 transition-all">{currentT.unlock}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <div className={`fixed inset-0 z-[-1] pointer-events-none overflow-hidden transition-all duration-700 ${isSearchFocused && searchQuery ? 'bg-slate-900/60 backdrop-blur-[5px] z-[30]' : ''}`}>
            <div className={`absolute -top-[10%] -left-[10%] w-[70vw] h-[70vw] rounded-full mix-blend-multiply blur-[100px] sm:blur-[120px] animate-float-slow transition-colors duration-1000 ${ambientClasses[0]}`}></div>
            <div className={`absolute top-[20%] -right-[10%] w-[60vw] h-[60vw] rounded-full mix-blend-multiply blur-[100px] sm:blur-[120px] animate-float-delayed transition-colors duration-1000 ${ambientClasses[1]}`}></div>
          </div>

          {isOffline && (

                  <label className={`flex items-center gap-3 p-5 border rounded-[1.5rem] cursor-pointer ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-slate-50 border-slate-200'}`}><input type="checkbox" checked={schoolEvent.active} onChange={e => { vibrate(20); setSchoolEvent({...schoolEvent, active: e.target.checked});}} className="w-5 h-5 accent-emerald-500" /><span className="font-bold">启用倒计时 / Aktifkan Countdown</span></label>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-2"><label className="text-[0.7rem] font-bold opacity-60 uppercase tracking-wider ml-1">{currentT.eventTitleZh}</label><input type="text" value={schoolEvent.zh} onChange={e => setSchoolEvent({...schoolEvent, zh: e.target.value})} className={`w-full border rounded-2xl px-5 py-4 outline-none font-medium focus:ring-2 focus:ring-emerald-500 ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`} placeholder="如: UASA 考试" /></div>
                    <div className="space-y-2"><label className="text-[0.7rem] font-bold opacity-60 uppercase tracking-wider ml-1">{currentT.eventTitleMs}</label><input type="text" value={schoolEvent.ms} onChange={e => setSchoolEvent({...schoolEvent, ms: e.target.value})} className={`w-full border rounded-2xl px-5 py-4 outline-none font-medium focus:ring-2 focus:ring-emerald-500 ${isDarkMode ? 'bg-slate-900/50 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`} placeholder="Cth: Peperiksaan UASA" /></div>
                    <div className="col-span-2 space-y-2"><label className="text-[0.7rem] font-bold opacity-60 uppercase tracking-wider ml-1">{currentT.eventDate}</label><input type="date" value={schoolEvent.date} onChange={e => setSchoolEvent({...schoolEvent, date: e.target.value})} className={`w-full border rounded-2xl px-5 py-4 outline-none font-bold focus:ring-2 focus:ring-emerald-500 ${isDarkMode ? 'bg-slate-900/50 border-slate-700 [color-scheme:dark]' : 'bg-white border-slate-200 shadow-sm'}`} /></div>
                  </div>
                  <button type="submit" disabled={isSaving || isOffline} className="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl mt-8 shadow-lg shadow-emerald-500/20 active:scale-95 flex justify-center items-center gap-2 transition-transform disabled:opacity-50 disabled:cursor-not-allowed">{isSaving ? <i className="ph-bold ph-spinner ph-spin text-xl"></i> : currentT.save}</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
